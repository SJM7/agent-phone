[project]
name = "agent-phone"
version = "0.1.0"
description = "Repurpose a Polycom VVX 300 desk phone as a control surface for parallel Claude Code / Codex terminal sessions: bind terminals with #, get LED-blink attention alerts, cycle terminals with *, and dictate prompts through the handset."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["hidapi>=0.14"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_phone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
